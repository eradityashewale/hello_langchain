[project]
name = "hello-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya Nathu Shewale", email = "er.adityashewale@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.0",
    "isort>=9.0.2",
    "langchain>=1.4.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
hello-langchain = "hello_langchain:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
